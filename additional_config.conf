# 1. Timeouts & upload limits
client_max_body_size 64m;
proxy_read_timeout 300;
proxy_connect_timeout 300;
proxy_send_timeout 300;

# 2. Security hardening: hide Nginx version from headers & error pages
server_tokens off;

# 3. Larger header buffers (prevents 502 errors from heavy cookies / JWTs)
proxy_buffer_size 128k;
proxy_buffers 4 256k;
proxy_busy_buffers_size 256k;
